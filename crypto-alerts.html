<style>
:root{
  /* Core brand — matches index.html */
  --brand:#1a1916;--brand-mid:#2d2b27;--brand-soft:#5a5248;
  --cream:#e8d5b0;--cream-l:#f2e6cb;--cream-d:#c9aa82;
  --taupe:#9a8f7e;--taupe-l:#b8a88a;--taupe-d:#6e6358;
  /* CTA */
  --cta:#f97316;--cta-d:#ea6f0e;
  /* Backgrounds — light by default */
  --bg:#ffffff;--bg2:#faf9f7;--bg3:#f4f2ef;--bg2:#faf9f7;--bg3:#f4f2ef;--bg-4:#ede8e0;
  /* Text */
  --text1:#1a1916;--text2:#5a5248;--text3:#9a8f7e;
  /* Hyphenated aliases (used in landing page CSS rules) */
  --text1:#1a1916;--text2:#5a5248;--text3:#9a8f7e;
  --cream-l:#f2e6cb;--cream-d:#c9aa82;
  /* Borders */
  --border:rgba(26,25,22,.1);--border-s:rgba(26,25,22,.2);--border-s:rgba(26,25,22,.2);
  /* Surfaces */
  --surface:rgba(26,25,22,.04);--surface2:rgba(26,25,22,.08);--surface2:rgba(26,25,22,.08);
  /* Status */
  --success:#9a8f7e;--danger:#e07b6a;
  /* Elevation */
  --sh-xs:0 1px 4px rgba(0,0,0,.05);
  --sh-sm:0 2px 12px rgba(0,0,0,.07);
  --sh:0 6px 28px rgba(0,0,0,.1);
  --sh-lg:0 16px 56px rgba(0,0,0,.16);
  /* Fonts */
  --fd:'Poppins',sans-serif;--fb:'Inter',sans-serif;--fm:'Inter',sans-serif;
  --radius:12px;--ease:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"]{
  --bg:#0c0b09;--bg2:#131109;--bg3:#1a1814;--bg2:#121009;--bg3:#1a1814;--bg-4:#221f1a;
  --text1:#f5f0e8;--text2:#9a8f7e;--text3:#5a5248;
  --text1:#f5f0e8;--text2:#9a8f7e;--text3:#5a5248;
  --cream:#e8d5b0;--cream-l:#f2e6cb;--cream-d:#c9aa82;
  --cream-l:#f2e6cb;--cream-d:#c9aa82;
  --border:rgba(232,213,176,.09);--border-s:rgba(232,213,176,.18);--border-s:rgba(232,213,176,.16);
  --surface:rgba(232,213,176,.05);--surface2:rgba(232,213,176,.09);--surface2:rgba(232,213,176,.08);
  --sh-xs:0 1px 4px rgba(0,0,0,.5);
  --sh-sm:0 2px 16px rgba(0,0,0,.55);
  --sh:0 6px 28px rgba(0,0,0,.65);
  --sh-lg:0 16px 56px rgba(0,0,0,.75);
}
[data-theme="dark"] nav.scrolled{background:rgba(12,11,9,.92)}
[data-theme="dark"] .preperm-card,[data-theme="dark"] .overlay-card{background:#1a1814;border-color:rgba(232,213,176,.15)}
[data-theme="dark"] .preperm-benefits,[data-theme="dark"] .ov-preview,[data-theme="dark"] .denied-steps{background:rgba(232,213,176,.04);border-color:rgba(232,213,176,.09)}

[data-theme="dark"] .faq-item.open{border-color:rgba(232,213,176,.2)}
[data-theme="dark"] .btn-ov-sec{border-color:rgba(232,213,176,.16);color:#9a8f7e}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text1);font-family:var(--fb);font-size:16px;line-height:1.6;overflow-x:hidden}

/* ═══ NAV ═══ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:14px 24px;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  transition:box-shadow .4s var(--ease);
}
nav.scrolled{box-shadow:var(--sh-sm)}
[data-theme="dark"] nav{background:rgba(12,11,9,.96);border-color:var(--border)}

.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-text{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--text1);line-height:1}
.logo-sub{font-family:var(--fm);font-size:9px;letter-spacing:.16em;color:var(--taupe);text-transform:uppercase;display:block;margin-top:2px;font-weight:500}

.nav-r{display:flex;align-items:center;gap:10px}
.live-dot{
  display:inline-block;width:7px;height:7px;
  background:var(--taupe);border-radius:50%;
  animation:blink 2s ease-in-out infinite;
  box-shadow:0 0 8px rgba(154,143,126,.55);
  flex-shrink:0;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.btn-theme{
  width:34px;height:34px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .2s;color:var(--text2);
}
.btn-theme:hover{background:var(--surface2)}
.nav-back{
  font-family:var(--fm);font-size:12px;font-weight:600;letter-spacing:.06em;
  color:var(--text2);padding:6px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  text-decoration:none;transition:all .2s;
}
.nav-back:hover{background:var(--surface2);color:var(--text1)}

/* ═══ SUBNAV ═══ */
.subnav{
  position:fixed;top:57px;left:0;right:0;z-index:99;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:0;
  padding:0;height:36px;
  overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  transform:translateY(0);transition:transform .35s var(--ease);
}
.subnav::-webkit-scrollbar{display:none}
.subnav--hidden{transform:translateY(-100%);pointer-events:none}
[data-theme="dark"] .subnav{background:rgba(12,11,9,.96);border-color:var(--border)}
.subnav-link{
  font-family:var(--fm);font-size:12px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--text2);text-decoration:none;
  padding:4px 14px;border-radius:14px;line-height:1.6;
  transition:background .18s,color .18s;
  white-space:nowrap;flex-shrink:0;
}
.subnav-link:hover{background:var(--surface2);color:var(--text1)}
.subnav-link.active{color:var(--text1);background:var(--surface)}
.subnav-sep{
  color:var(--border-s);font-size:14px;user-select:none;
  flex-shrink:0;padding:0 2px;
}

.orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;animation:orbFloat 22s ease-in-out infinite}
.orb-1{width:700px;height:700px;background:radial-gradient(circle,rgba(232,213,176,.055),transparent 70%);top:-250px;left:-150px}
.orb-2{width:500px;height:500px;background:radial-gradient(circle,rgba(154,143,126,.07),transparent 70%);top:40%;right:-200px;animation-delay:-8s}









.btn-cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--cta),var(--cta-d));color:#fff;font-family:var(--fd);font-weight:900;font-size:18px;letter-spacing:.04em;text-transform:uppercase;padding:18px 48px;border-radius:50px;border:none;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;box-shadow:0 8px 32px rgba(249,115,22,.28);animation:fadeUp .8s var(--ease) .24s both;position:relative;overflow:hidden}
.btn-cta::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent);opacity:0;transition:opacity .2s}
.btn-cta:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 12px 48px rgba(249,115,22,.38)}
.btn-cta:hover::before{opacity:1}
.btn-cta:active{transform:scale(.98)}
.btn-cta .ico{transition:transform .3s var(--ease)}
.btn-cta:hover .ico{transform:translateX(4px)}
.trust{font-family:var(--fm);font-size:11px;color:var(--text3);margin-top:12px;animation:fadeUp .8s var(--ease) .3s both}

.wrap{max-width:860px;margin:0 auto;padding:0 24px}
.section{padding:100px 0;border-top:1px solid var(--border)}
.sec-tag{font-family:var(--fm);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe);margin-bottom:12px;font-weight:600}
.sec-h{font-family:var(--fd);font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:16px}
.sec-sub{font-size:17px;color:var(--text2);max-width:560px;line-height:1.7;margin-bottom:48px}

.coins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:40px}
.coin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:border-color .2s}
.coin-card:hover{border-color:var(--border-s)}
.coin-sym{font-family:var(--fm);font-size:12px;color:var(--cream-d);letter-spacing:.1em;margin-bottom:8px}
.coin-name{font-family:var(--fd);font-weight:800;font-size:20px;margin-bottom:8px}
.coin-desc{font-size:13px;color:var(--text2);line-height:1.6}

.signal-list{display:flex;flex-direction:column;gap:12px;margin-top:32px}
.signal{display:flex;align-items:flex-start;gap:16px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.signal-icon{font-size:22px;flex-shrink:0;margin-top:2px}
.signal-t{font-family:var(--fd);font-weight:800;font-size:17px;margin-bottom:4px}
.signal-d{font-size:14px;color:var(--text2);line-height:1.6}

.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:40px}
.guide-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;transition:border-color .2s,background .2s}
.guide-card:hover{border-color:var(--border-s);background:var(--surface2)}
.guide-icon{font-size:28px;margin-bottom:14px;display:block}
.guide-title{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:-.01em;margin-bottom:8px;color:var(--text1)}
.guide-desc{font-size:14px;color:var(--text2);line-height:1.65}
.guide-desc a{color:var(--cream-d);text-decoration:none;border-bottom:1px solid rgba(201,170,130,.3)}
.guide-desc a:hover{border-color:var(--cream-d)}


.article h2{font-family:var(--fd);font-size:clamp(22px,3vw,34px);font-weight:800;letter-spacing:-.03em;margin:40px 0 14px;line-height:1.1}
.article h2:first-child{margin-top:0}
.article p{font-size:16px;color:var(--text2);line-height:1.8;margin-bottom:18px}
.article strong{color:var(--text1)}
.article a{color:var(--cream-d);text-decoration:none;border-bottom:1px solid rgba(201,170,130,.3);transition:border-color .2s}
.article a:hover{border-color:var(--cream-d)}
.article ul{margin:16px 0 24px 20px;display:flex;flex-direction:column;gap:8px}
.article ul li{font-size:15px;color:var(--text2);line-height:1.65}

.faq-list{margin-top:40px;display:flex;flex-direction:column;gap:1px}
.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.faq-q{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:var(--fd);font-weight:700;font-size:17px}
.faq-arr{font-size:11px;color:var(--text3);transition:transform .3s;font-family:var(--fm)}
.faq-item.open .faq-arr{transform:rotate(180deg)}
.faq-a{padding:0 24px;max-height:0;overflow:hidden;font-size:15px;color:var(--text2);line-height:1.7;transition:max-height .4s var(--ease),padding .3s}
.faq-item.open .faq-a{max-height:200px;padding:0 24px 20px}

.cta-banner{background:linear-gradient(135deg,rgba(232,213,176,.07),rgba(154,143,126,.04));border:1px solid var(--border-s);border-radius:20px;padding:56px 40px;text-align:center;margin-top:80px}
.cta-banner h2{font-family:var(--fd);font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.03em;margin-bottom:16px}
.cta-banner p{color:var(--text2);font-size:17px;margin-bottom:36px}

footer{position:relative;z-index:1;padding-bottom:120px;padding:48px 24px 120px;border-top:1px solid var(--border);text-align:center}
.foot-links{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:16px}
.foot-links a{font-family:var(--fm);font-size:11px;color:var(--text3);text-decoration:none;transition:color .2s}
.foot-links a:hover{color:var(--text2)}
.foot-copy{font-family:var(--fm);font-size:11px;color:var(--text3)}

/* PRE-PERMISSION MODAL */
.preperm-bg{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(12,11,9,.88);backdrop-filter:blur(20px);opacity:0;pointer-events:none;transition:opacity .35s;padding:24px}
.preperm-bg.open{opacity:1;pointer-events:all}
.preperm-card{background:#1a1814;border-radius:28px;padding:40px 32px 32px;max-width:400px;width:100%;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,.5);border:1px solid rgba(232,213,176,.15);transform:scale(.93) translateY(12px);transition:transform .45s var(--ease)}
.preperm-bg.open .preperm-card{transform:scale(1) translateY(0)}
.preperm-icon{font-size:48px;margin-bottom:16px;display:block;line-height:1}
.preperm-title{font-family:var(--fd);font-weight:900;font-size:22px;letter-spacing:-.02em;color:var(--text1);margin-bottom:8px}
.preperm-sub{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.preperm-benefits{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;text-align:left;background:rgba(232,213,176,.04);border-radius:14px;padding:14px 16px;border:1px solid var(--border)}
.preperm-benefit{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}
.preperm-benefit-dot{width:6px;height:6px;border-radius:50%;background:var(--cta);flex-shrink:0}
.preperm-yes{width:100%;background:linear-gradient(135deg,var(--cta),var(--cta-d));color:#fff;font-family:var(--fd);font-weight:900;font-size:16px;padding:15px;border-radius:50px;border:none;cursor:pointer;transition:opacity .2s,transform .2s;box-shadow:0 4px 16px rgba(249,115,22,.28);margin-bottom:10px}
.preperm-yes:hover{opacity:.92;transform:translateY(-1px)}
.preperm-no{width:100%;background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;padding:8px;transition:color .2s;font-family:var(--fb)}
.preperm-no:hover{color:var(--text2)}

/* OVERLAYS */
.overlay-bg{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(12,11,9,.9);backdrop-filter:blur(20px);opacity:0;pointer-events:none;transition:opacity .4s;padding:24px}
.overlay-bg.open{opacity:1;pointer-events:all}
.overlay-card{background:#1a1814;border-radius:28px;padding:48px 36px;max-width:420px;width:100%;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,.5);transform:scale(.92);transition:transform .5s var(--ease)}
.overlay-bg.open .overlay-card{transform:scale(1)}
.overlay-card.success{border:2px solid rgba(201,170,130,.3)}
.overlay-card.already{border:2px solid rgba(232,213,176,.4)}
.overlay-card.denied{border:2px solid rgba(224,123,106,.25)}
.ring{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 22px;animation:popIn .6s var(--ease) .15s both}
.ring.success{background:linear-gradient(135deg,var(--cream-d),var(--taupe));box-shadow:0 0 40px rgba(201,170,130,.25)}
.ring.already{background:linear-gradient(135deg,var(--cream-l),var(--cream-d));box-shadow:0 0 40px rgba(232,213,176,.3)}
.ring.denied{width:72px;height:72px;font-size:28px;background:linear-gradient(135deg,var(--danger),#c05a4a);box-shadow:0 0 36px rgba(224,123,106,.2)}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.ov-title{font-family:var(--fd);font-weight:800;font-size:26px;margin-bottom:10px;letter-spacing:-.02em;color:var(--text1)}
.ov-sub{font-size:14px;color:var(--text2);margin-bottom:22px;line-height:1.65}
.ov-preview{background:rgba(232,213,176,.04);border-radius:16px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;text-align:left;margin-bottom:22px;border:1px solid var(--border)}
.ov-preview-text{font-size:12px;color:var(--text2)}
.ov-preview-text strong{display:block;font-family:var(--fd);font-size:13px;font-weight:700;color:var(--text1);margin-bottom:2px}
.denied-steps{background:rgba(232,213,176,.04);border-radius:14px;padding:16px;margin-bottom:20px;display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--border)}
.d-step{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text2)}
.d-num{width:22px;height:22px;border-radius:50%;background:rgba(224,123,106,.12);border:1px solid rgba(224,123,106,.28);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:10px;color:var(--danger);margin-top:1px;font-weight:700}
.btn-ov-primary{width:100%;background:linear-gradient(135deg,var(--cta),var(--cta-d));color:#fff;font-family:var(--fd);font-weight:700;font-size:16px;padding:15px;border-radius:50px;border:none;cursor:pointer;transition:opacity .2s;box-shadow:0 4px 16px rgba(249,115,22,.25)}
.btn-ov-primary:hover{opacity:.9}
.btn-ov-sec{width:100%;background:none;border:1px solid var(--border-s);color:var(--text2);font-size:14px;padding:12px;border-radius:50px;cursor:pointer;transition:all .2s;font-family:var(--fb);margin-top:8px}
.btn-ov-sec:hover{color:var(--text1)}


/* ═══ LIVE ALERT FEED ═══ */
.feed-section{padding:52px 0 80px;}
.feed-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:gap}
.feed-status{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;color:var(--text3)}

<script>
/* ═══ MODAL ACCESSIBILITY: aria-modal, focus trap, Escape ═══ */
(function(){
  const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
  function trapFocus(modal){
    const els=[...modal.querySelectorAll(FOCUSABLE)];
    if(!els.length)return;
    els[0].focus();
    modal.addEventListener('keydown',function ft(e){
      if(e.key==='Tab'){
        const fi=els[0],la=els[els.length-1];
        if(e.shiftKey&&document.activeElement===fi){e.preventDefault();la.focus();}
        else if(!e.shiftKey&&document.activeElement===la){e.preventDefault();fi.focus();}
      }
      if(e.key==='Escape'){
        modal.classList.remove('open');
        modal.removeEventListener('keydown',ft);
      }
    });
  }
  const mo=new MutationObserver(muts=>{
    muts.forEach(m=>{
      m.target.querySelectorAll('.overlay-bg.open,.preperm-bg.open').forEach(modal=>{
        if(!modal.dataset.a11yInit){
          modal.dataset.a11yInit='1';
          modal.setAttribute('role','dialog');
          modal.setAttribute('aria-modal','true');
          if(h){if(!h.id)h.id='modal-title-'+Math.random().toString(36).slice(2,7);modal.setAttribute('aria-labelledby',h.id);}
          trapFocus(modal);
        }
      });
    });
  });
  mo.observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});
})();
</script>

  fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:'a4b6220e-4b69-41bd-966b-59d0f1014186',email:em,subject:'PushDirect email signup ('+location.pathname+')',message:'Email: '+em})}).then(r=>r.json()).then(d=>{if(d.success){document.getElementById('pdDeniedForm').style.display='none';document.getElementById('pdDeniedThanks').style.display='block';}}).catch(()=>{});
}
