/* ═══ SUBNAV HOVER REVEAL ═══ */
let subnavHovered=false;
const subnavEl=document.getElementById('subnav');
const mainNavEl=document.getElementById('mainNav');
function showSubnav(){subnavHovered=true;subnavEl.classList.remove('subnav--hidden')}
function hideSubnav(){subnavHovered=false;if(window.scrollY>10)subnavEl.classList.add('subnav--hidden')}
mainNavEl.addEventListener('mouseenter',showSubnav);
mainNavEl.addEventListener('mouseleave',hideSubnav);
subnavEl.addEventListener('mouseenter',showSubnav);
subnavEl.addEventListener('mouseleave',hideSubnav);
window.addEventListener('scroll',()=>{
  if(!subnavHovered)subnavEl.classList.toggle('subnav--hidden',window.scrollY>10);
},{passive:true});
function toggleFaq(el){
  const item=el.closest('.faq-item');
  const open=item.classList.contains('open');
  document.querySelectorAll('.faq-item').forEach(i=>i.classList.remove('open'));
  if(!open)item.classList.add('open');
}
(function(){
  const saved=localStorage.getItem('pd_theme');
  if(saved)document.documentElement.setAttribute('data-theme',saved);
  const btn=document.getElementById('themeBtn');
  function sync(){btn.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙'}
  sync();
  btn.addEventListener('click',()=>{
    const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    localStorage.setItem('pd_theme',next);
    sync();
  });
})();

</script>

<script>
/* ═══ MODAL ACCESSIBILITY: aria-modal, focus trap, Escape ═══ */
(function(){
  const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
  function trapFocus(modal){
    const els=[...modal.querySelectorAll(FOCUSABLE)];
    if(!els.length)return;
    els[0].focus();
    modal.addEventListener('keydown',function ft(e){
      if(e.key==='Tab'){
        const fi=els[0],la=els[els.length-1];
        if(e.shiftKey&&document.activeElement===fi){e.preventDefault();la.focus();}
        else if(!e.shiftKey&&document.activeElement===la){e.preventDefault();fi.focus();}
      }
      if(e.key==='Escape'){
        modal.classList.remove('open');
        modal.removeEventListener('keydown',ft);
      }
    });
  }
  const mo=new MutationObserver(muts=>{
    muts.forEach(m=>{
      m.target.querySelectorAll('.overlay-bg.open,.preperm-bg.open').forEach(modal=>{
        if(!modal.dataset.a11yInit){
          modal.dataset.a11yInit='1';
          modal.setAttribute('role','dialog');
          modal.setAttribute('aria-modal','true');
          if(h){if(!h.id)h.id='modal-title-'+Math.random().toString(36).slice(2,7);modal.setAttribute('aria-labelledby',h.id);}
          trapFocus(modal);
        }
      });
    });
  });
  mo.observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});
})();
</script>

/* ═══ PUSH STACK ═══ */
(function(){
  const granted='Notification' in window&&Notification.permission==='granted';
  if(!granted){
    window.addEventListener('scroll',function(){
      const sb=document.getElementById('pdStickyBar');
      if(!sb)return;
      const p=Math.round((window.scrollY/(document.body.scrollHeight-window.innerHeight||1))*100);
      sb.classList.toggle('visible',p>20);
    },{passive:true});
  }
})();
let _pdRaLoaded=false;
function pdLoadRA(){
  if(_pdRaLoaded)return;_pdRaLoaded=true;
  const url=new URL(window.location.href);
  const s=document.createElement('script');s.dataset.cfasync='false';
  window.raOptions={zoneID:2822452,extClickID:url.searchParams.get('click_id')||sessionStorage.getItem('pd_click_id')||'',subID1:url.searchParams.get('source_id')||'',
    actions:{
      onPermissionGranted:function(){if(typeof gtag!=='undefined')gtag('event','subscribed_rollerads',{page:location.pathname,pd_variant:typeof PD_VARIANT!=='undefined'?PD_VARIANT:'?'});document.getElementById('pdStickyBar')&&document.getElementById('pdStickyBar').classList.remove('visible');document.getElementById('pdAlreadyBg').classList.add('open');},
      onPermissionDenied:function(){document.getElementById('pdDeniedBg').classList.add('open');},
      onAlreadySubscribed:function(){document.getElementById('pdAlreadyBg').classList.add('open');},
      onError:function(){if('Notification' in window&&Notification.permission==='granted')document.getElementById('pdAlreadyBg').classList.add('open');else document.getElementById('pdDeniedBg').classList.add('open');}
    }};
  s.src='https://push-sdk.com/f/sdk.js?z=2822452';document.head.appendChild(s);
}
function pdActivateMonetag(){
  if(window._pdMtLoaded)return;window._pdMtLoaded=true;
  const s=document.createElement('script');s.src='https://nap5k.com/tag.min.js';s.dataset.zone='11024677';document.body.appendChild(s);
}
function pdRequestPush(){
  const ua=navigator.userAgent;
  const isIOS=/iPad|iPhone|iPod/.test(ua)&&!window.MSStream;
  const isMacSafari=/Macintosh/.test(ua)&&/Safari/.test(ua)&&!/Chrome|Firefox|Edg/.test(ua);
  if(isIOS||isMacSafari){pdActivateMonetag();document.getElementById('pdIosBg').classList.add('open');return;}
  if(!('Notification' in window))return;
  if(Notification.permission==='denied'){document.getElementById('pdDeniedBg').classList.add('open');return;}
  if(Notification.permission==='granted'){document.getElementById('pdAlreadyBg').classList.add('open');pdLoadRA();return;}
  pdLoadRA();
}
function pdSubmitEmail(e){
  e.preventDefault();
  const em=document.getElementById('pdDeniedEmail').value.trim();
  if(!em)return;
  fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:'a4b6220e-4b69-41bd-966b-59d0f1014186',email:em,subject:'PushDirect email signup ('+location.pathname+')',message:'Email: '+em})}).then(r=>r.json()).then(d=>{if(d.success){document.getElementById('pdDeniedForm').style.display='none';document.getElementById('pdDeniedThanks').style.display='block';}}).catch(()=>{});
}
</script>
